name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/server/prisma/schema.prisma

      - name: Type check shared
        run: npm run typecheck -w packages/shared

      - name: Type check server
        run: npm run typecheck -w apps/server

      - name: Type check client
        run: npm run typecheck -w apps/client

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/server/prisma/schema.prisma

      - name: Build shared
        run: echo "Shared package is used as TypeScript source"

      - name: Build server
        run: npm run build -w apps/server

      - name: Build client
        run: npm run build -w apps/client
        env:
          VITE_API_URL: ''
          VITE_WS_URL: ''

  validate-prisma:
    name: Validate Prisma Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate schema
        run: npx prisma validate --schema=apps/server/prisma/schema.prisma
